[workspace]
resolver = "3"
members = ["crates/*", "eval", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Galactic717/pcsleuth"
publish = false

# Versions are declared once here. A package that needs another dependency adds it to its own
# Cargo.toml and says so in its PR.
[workspace.dependencies]
pcsleuth-core = { path = "crates/core" }
pcsleuth-engine = { path = "crates/engine" }
pcsleuth-sources = { path = "crates/sources" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.39", features = ["serde"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
windows = "0.62.2"
