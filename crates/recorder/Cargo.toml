[package]
name = "pcsleuth-recorder"
description = "Optional recorder: samples into a fixed-size ring file for what the logs miss"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pcsleuth_recorder"
path = "src/lib.rs"

[[bin]]
name = "pcsleuth-recorder"
path = "src/main.rs"
doc = false

# This package adds no dependency that the workspace does not already declare. It adds Windows
# features (below) for the service, the security descriptor, the console handler and the
# measurement calls.
[dependencies]
clap.workspace = true
jiff.workspace = true
pcsleuth-core.workspace = true
pcsleuth-sources.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_Threading",
]
