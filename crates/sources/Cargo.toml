[package]
name = "pcsleuth-sources"
description = "Readers for the logs, APIs and databases Windows keeps; each returns a Sourced value"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Dependencies and Windows features are declared here once, for every module, so the packages that
# fill the modules in parallel do not edit this file.
[dependencies]
jiff.workspace = true
pcsleuth-core.workspace = true
quick-xml.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Power",
    "Win32_Storage_Jet",
    "Win32_Storage_FileSystem",
    "Win32_System_TaskScheduler",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
