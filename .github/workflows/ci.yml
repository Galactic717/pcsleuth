name: CI

# Every push and every pull request. Nothing here is allowed to fail quietly: no continue-on-error,
# no `|| true`. A red step is a real problem.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

# The token can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: fmt, clippy, test, eval
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bash stops at the first failing command; a multi-line pwsh step only reports the last one.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-gnu --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the no-network test (rule 2) and the fixture redaction check. --no-fail-fast runs every
      # crate, so one red crate does not hide the others.
      - name: Test
        run: cargo test --workspace --no-fail-fast --locked

      # The page: npm ci installs exactly what package-lock.json pins.
      - name: App, install
        working-directory: app
        run: npm ci

      - name: App, typecheck
        working-directory: app
        run: npm run typecheck

      - name: App, test
        working-directory: app
        run: npm test

      - name: App, build
        working-directory: app
        run: npm run build

      # The core crate must stay portable: the contract types are read by tools that do not run on Windows.
      - name: Check the core crate for Linux
        run: cargo check -p pcsleuth-core --target x86_64-unknown-linux-gnu --locked

      # The runner is an elevated VM that cannot sleep, so a sleep or wake scenario reports not_run
      # there, and that is the correct result. Low scores do not fail this step; a harness error does.
      - name: Eval
        env:
          PCSLEUTH_EVAL_WHERE: ci
        run: cargo run -p pcsleuth-eval --locked -- run

      - name: Upload the eval results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-ci
          path: eval/results/run-*-ci.json
          if-no-files-found: warn
